<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Pipeline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-primary:hover { background: #2563eb; }

    .btn-ghost {
      background: transparent;
      color: #94a3b8;
      padding: 4px 8px;
    }
    .btn-ghost:hover { color: #e2e8f0; }

    .btn-danger {
      background: transparent;
      color: #f87171;
      padding: 4px 8px;
    }
    .btn-danger:hover { color: #ef4444; }

    .pipeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 24px 32px;
      min-height: calc(100vh - 81px);
      align-items: start;
    }

    .stage {
      background: #1e293b;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }

    .stage-header {
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .stage-title {
      font-size: 0.875rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }

    .stage-count {
      background: #334155;
      color: #cbd5e1;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .stage-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 100px;
      transition: background 0.15s;
    }

    .stage-body.drag-over {
      background: #334155;
      border-radius: 0 0 12px 12px;
    }

    .card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      cursor: grab;
      transition: border-color 0.15s, box-shadow 0.15s, opacity 0.15s;
      user-select: none;
    }

    .card:hover {
      border-color: #3b82f6;
    }

    .card.dragging {
      opacity: 0.4;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: #f1f5f9;
      flex: 1;
    }

    .card-actions {
      display: flex;
      gap: 2px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .card:hover .card-actions {
      opacity: 1;
    }

    .card-value {
      font-size: 0.8rem;
      color: #3b82f6;
      font-weight: 600;
      margin-top: 4px;
    }

    .card-desc {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 4px;
      line-height: 1.4;
    }

    .card-date {
      font-size: 0.7rem;
      color: #475569;
      margin-top: 8px;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal h2 {
      font-size: 1.1rem;
      color: #f8fafc;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 12px;
      color: #e2e8f0;
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #3b82f6;
    }

    .form-group textarea { resize: vertical; min-height: 60px; }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover { background: #475569; }

    /* Stage colors */
    .stage[data-stage="lead"] .stage-title { color: #a78bfa; }
    .stage[data-stage="lead"] .stage-count { background: #4c1d95; color: #c4b5fd; }
    .stage[data-stage="proposal"] .stage-title { color: #fbbf24; }
    .stage[data-stage="proposal"] .stage-count { background: #78350f; color: #fcd34d; }
    .stage[data-stage="active"] .stage-title { color: #34d399; }
    .stage[data-stage="active"] .stage-count { background: #064e3b; color: #6ee7b7; }
    .stage[data-stage="done"] .stage-title { color: #60a5fa; }
    .stage[data-stage="done"] .stage-count { background: #1e3a5f; color: #93c5fd; }

    @media (max-width: 768px) {
      .pipeline {
        grid-template-columns: 1fr;
        padding: 16px;
      }
      header { padding: 16px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Project Pipeline</h1>
  <button class="btn btn-primary" onclick="openModal()">+ New Project</button>
</header>

<div class="pipeline" id="pipeline"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
  <div class="modal">
    <h2 id="modalTitle">New Project</h2>
    <div class="form-group">
      <label>Project Name *</label>
      <input type="text" id="inputName" placeholder="e.g. Website Redesign" />
    </div>
    <div class="form-group">
      <label>Value ($)</label>
      <input type="number" id="inputValue" placeholder="e.g. 15000" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="inputDesc" placeholder="Brief description..."></textarea>
    </div>
    <div class="form-group">
      <label>Stage</label>
      <select id="inputStage">
        <option value="lead">Lead</option>
        <option value="proposal">Proposal</option>
        <option value="active">Active</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modalSubmit" onclick="saveProject()">Create</button>
    </div>
  </div>
</div>

<script>
  const STAGES = [
    { id: 'lead', label: 'Lead' },
    { id: 'proposal', label: 'Proposal' },
    { id: 'active', label: 'Active' },
    { id: 'done', label: 'Done' },
  ];

  const STORAGE_KEY = 'pipeline_projects';

  // --- Data ---
  function loadProjects() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveProjects(projects) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));
  }

  let projects = loadProjects();
  let editingId = null;
  let draggedId = null;

  // --- Render ---
  function render() {
    const pipeline = document.getElementById('pipeline');
    pipeline.innerHTML = '';

    STAGES.forEach(stage => {
      const stageProjects = projects.filter(p => p.stage === stage.id);
      const totalValue = stageProjects.reduce((sum, p) => sum + (p.value || 0), 0);

      const stageEl = document.createElement('div');
      stageEl.className = 'stage';
      stageEl.dataset.stage = stage.id;

      const countLabel = totalValue > 0
        ? `${stageProjects.length} &middot; $${totalValue.toLocaleString()}`
        : `${stageProjects.length}`;

      stageEl.innerHTML = `
        <div class="stage-header">
          <span class="stage-title">${stage.label}</span>
          <span class="stage-count">${countLabel}</span>
        </div>
        <div class="stage-body" data-stage="${stage.id}"></div>
      `;

      const body = stageEl.querySelector('.stage-body');

      // Drop zone events
      body.addEventListener('dragover', e => {
        e.preventDefault();
        body.classList.add('drag-over');
      });

      body.addEventListener('dragleave', () => {
        body.classList.remove('drag-over');
      });

      body.addEventListener('drop', e => {
        e.preventDefault();
        body.classList.remove('drag-over');
        if (draggedId) {
          const project = projects.find(p => p.id === draggedId);
          if (project) {
            project.stage = stage.id;
            saveProjects(projects);
            render();
          }
        }
      });

      stageProjects.forEach(project => {
        const card = document.createElement('div');
        card.className = 'card';
        card.draggable = true;
        card.dataset.id = project.id;

        card.addEventListener('dragstart', e => {
          draggedId = project.id;
          card.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        card.addEventListener('dragend', () => {
          card.classList.remove('dragging');
          draggedId = null;
          document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        });

        const valueHtml = project.value
          ? `<div class="card-value">$${project.value.toLocaleString()}</div>`
          : '';
        const descHtml = project.description
          ? `<div class="card-desc">${escapeHtml(project.description)}</div>`
          : '';
        const dateStr = new Date(project.createdAt).toLocaleDateString();

        card.innerHTML = `
          <div class="card-header">
            <span class="card-name">${escapeHtml(project.name)}</span>
            <div class="card-actions">
              <button class="btn btn-ghost" onclick="editProject('${project.id}')" title="Edit">&#9998;</button>
              <button class="btn btn-danger" onclick="deleteProject('${project.id}')" title="Delete">&times;</button>
            </div>
          </div>
          ${valueHtml}
          ${descHtml}
          <div class="card-date">Created ${dateStr}</div>
        `;

        body.appendChild(card);
      });

      pipeline.appendChild(stageEl);
    });
  }

  // --- CRUD ---
  function openModal(id) {
    editingId = id || null;
    const overlay = document.getElementById('modalOverlay');
    const title = document.getElementById('modalTitle');
    const submit = document.getElementById('modalSubmit');

    if (editingId) {
      const p = projects.find(p => p.id === editingId);
      if (!p) return;
      title.textContent = 'Edit Project';
      submit.textContent = 'Save';
      document.getElementById('inputName').value = p.name;
      document.getElementById('inputValue').value = p.value || '';
      document.getElementById('inputDesc').value = p.description || '';
      document.getElementById('inputStage').value = p.stage;
    } else {
      title.textContent = 'New Project';
      submit.textContent = 'Create';
      document.getElementById('inputName').value = '';
      document.getElementById('inputValue').value = '';
      document.getElementById('inputDesc').value = '';
      document.getElementById('inputStage').value = 'lead';
    }

    overlay.classList.add('open');
    document.getElementById('inputName').focus();
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    editingId = null;
  }

  function closeModalOnOverlay(e) {
    if (e.target === e.currentTarget) closeModal();
  }

  function saveProject() {
    const name = document.getElementById('inputName').value.trim();
    if (!name) {
      document.getElementById('inputName').focus();
      return;
    }

    const value = parseInt(document.getElementById('inputValue').value) || 0;
    const description = document.getElementById('inputDesc').value.trim();
    const stage = document.getElementById('inputStage').value;

    if (editingId) {
      const p = projects.find(p => p.id === editingId);
      if (p) {
        p.name = name;
        p.value = value;
        p.description = description;
        p.stage = stage;
      }
    } else {
      projects.push({
        id: crypto.randomUUID(),
        name,
        value,
        description,
        stage,
        createdAt: new Date().toISOString(),
      });
    }

    saveProjects(projects);
    closeModal();
    render();
  }

  function editProject(id) {
    openModal(id);
  }

  function deleteProject(id) {
    if (!confirm('Delete this project?')) return;
    projects = projects.filter(p => p.id !== id);
    saveProjects(projects);
    render();
  }

  // --- Util ---
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // --- Keyboard ---
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  // --- Init ---
  render();
</script>

</body>
</html>
